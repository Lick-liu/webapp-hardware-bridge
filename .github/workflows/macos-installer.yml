name: macOS print helper installers

on:
  push:
    branches: [codex/20261020-macos-installer]
    paths:
      - '.github/workflows/macos-installer.yml'
      - 'scripts/macos/**'
      - 'src/**'
      - 'build.gradle'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
          - runner: macos-15-intel
            architecture: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
        with:
          gradle-version: '8.13'
          cache-disabled: true
      - name: Build and verify native installers
        run: python3 scripts/macos/build-installer.py --architecture '${{ matrix.architecture }}'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: tea-print-helper-macos-${{ matrix.architecture }}
          path: |
            build/macos/installers/*
            build/macos/evidence/*
            build/test-results/test/*.xml
          if-no-files-found: error
          retention-days: 14
