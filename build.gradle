plugins {
    id 'java'
    id 'application'
}

group 'webapp-hardware-bridge'
version '1.0.1'

sourceCompatibility = '17'
targetCompatibility = '17'

repositories {
    mavenCentral()
}

dependencies {
    // The production code uses the SLF4J logging API at compile time
    implementation group: 'org.apache.logging.log4j', name: 'log4j-slf4j2-impl', version: '2.23.1'

    implementation group: 'commons-io', name: 'commons-io', version: '2.16.1'
    implementation group: 'commons-codec', name: 'commons-codec', version: '1.17.1'
    implementation group: 'org.apache.httpcomponents.core5', name: 'httpcore5', version: '5.2.5'
    implementation group: 'com.fasterxml.jackson.core', name: 'jackson-databind', version: '2.17.2'
    implementation group: 'com.fazecast', name: 'jSerialComm', version: '2.11.0'
    implementation group: 'org.apache.pdfbox', name: 'pdfbox', version: '2.0.31'
    implementation group: 'org.bouncycastle', name: 'bcprov-jdk18on', version: '1.78.1'
    implementation group: 'org.bouncycastle', name: 'bcpkix-jdk18on', version: '1.78.1'
    implementation group: 'io.javalin', name: 'javalin', version: '6.2.0'
    implementation group: 'io.javalin.community.ssl', name: 'ssl-plugin', version: '6.2.0'

    compileOnly 'org.projectlombok:lombok:1.18.34'
    annotationProcessor 'org.projectlombok:lombok:1.18.34'

    testCompileOnly 'org.projectlombok:lombok:1.18.34'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.34'

    testImplementation group: 'junit', name: 'junit', version: '4.13.2'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

application {
    mainClass = 'tigerworkshop.webapphardwarebridge.GUI'
}

jar {
    archiveFileName = 'webapp-hardware-bridge.jar'
    manifest {
        attributes 'Main-Class': application.mainClass.get()
    }
}

tasks.register('stageInstallerFiles', Copy) {
    dependsOn jar
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    into layout.projectDirectory.dir('out/artifacts/webapp_hardware_bridge_jar')
    from tasks.named('jar')
    from configurations.runtimeClasspath
    from('src/main/resources/web') {
        into 'web'
    }
    from('tls') {
        into 'tls'
    }
}

tasks.register('stageLinuxDistribution', Copy) {
    dependsOn jar
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    into layout.buildDirectory.dir('linux-dist/webapp-hardware-bridge')
    from(tasks.named('jar')) {
        into 'lib'
    }
    from(configurations.runtimeClasspath) {
        into 'lib'
    }
    from('src/main/resources/web') {
        into 'web'
    }
    from('tls') {
        into 'tls'
    }
    from('src/linux/bin') {
        into 'bin'
        fileMode = 0755
    }
    from('LINUX.md')
    from('README.md')
    from('LICENSE')
}

tasks.register('linuxTar', Tar) {
    dependsOn stageLinuxDistribution
    archiveBaseName = 'webapp-hardware-bridge'
    archiveClassifier = 'linux-x86_64'
    archiveExtension = 'tar.gz'
    compression = Compression.GZIP
    destinationDirectory = layout.projectDirectory.dir('out/distributions')

    from(layout.buildDirectory.dir('linux-dist'))

    eachFile { details ->
        if (details.path.startsWith('webapp-hardware-bridge/bin/')) {
            details.mode = 0755
        }
    }
}
